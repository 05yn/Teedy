name: Teedy CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg npm tesseract-ocr-all mediainfo
          sudo npm install -g grunt-cli --force
          java -version
          mvn -version
          node -v
          npm -v
          grunt --version

      - name: Maven build
        run: mvn -B -DskipTests clean install

      - name: PMD code check
        continue-on-error: true
        run: mvn -B -DskipTests org.apache.maven.plugins:maven-pmd-plugin:3.21.2:pmd

      - name: Run tests
        continue-on-error: true
        run: mvn -B -Dmaven.test.failure.ignore=true test

      - name: Generate test report
        if: always()
        continue-on-error: true
        run: mvn -B surefire-report:report-only

      - name: Generate JavaDoc
        if: always()
        continue-on-error: true
        run: mvn -B -DskipTests -Dmaven.javadoc.failOnError=false org.apache.maven.plugins:maven-javadoc-plugin:3.6.3:javadoc org.apache.maven.plugins:maven-javadoc-plugin:3.6.3:jar

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teedy-ci-artifacts
          path: |
            **/target/*.jar
            **/target/*.war
            **/target/site/**/*.html
            **/target/apidocs/**
            **/target/*-javadoc.jar
            **/target/surefire-reports/**
